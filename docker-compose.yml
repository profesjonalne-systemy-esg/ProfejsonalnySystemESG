
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: esg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: esg_database
      POSTGRES_USER: esg_user
      POSTGRES_PASSWORD: esg_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
